# CI 为每次运行创建唯一的隔离 PostgreSQL 测试库，并显式设置
# OPSPILOT_TEST_DATABASE_URL；破坏性 live 测试只能在该库执行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: opspilot
        run: |
          psql --host=127.0.0.1 --port=5433 --username=opspilot --dbname=opspilot \
            --set=ON_ERROR_STOP=1 --command="CREATE DATABASE opspilot_test_ci"
      - name: Apply Alembic migrations to isolated PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@127.0.0.1:5433/opspilot_test_ci
        run: python -m alembic -c alembic.ini upgrade head
      - name: Layered regression (unit / integration / e2e / property / security)
        env:
          DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@127.0.0.1:5433/opspilot_test_ci
          OPSPILOT_TEST_DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@127.0.0.1:5433/opspilot_test_ci
        run: |
          python scripts/run_tests.py
      - name: Static and boundary checks
        env:
          DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@127.0.0.1:5433/opspilot_test_ci
          OPSPILOT_TEST_DATABASE_URL: postgresql+psycopg2://opspilot:opspilot@127.0.0.1:5433/opspilot_test_ci
        run: |
          python -m compileall -q src scripts alembic
          python scripts/review_v12_boundaries.py
          python scripts/review_v12_boundaries.py --pg
          git diff --check
